name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE: dvops-bloggers-app
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Jest tests
        run: npm run test:coverage
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run Playwright tests
        run: npx playwright test --ignore-snapshots
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build and Push to Azure
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Login to Azure Container Registry
        run: az acr login --name dvopsbloggers
      
      - name: Build and push Docker image
        run: |
          docker build -t dvopsbloggers.azurecr.io/dvops-bloggers-app:${{ github.run_number }} .
          docker tag dvopsbloggers.azurecr.io/dvops-bloggers-app:${{ github.run_number }} dvopsbloggers.azurecr.io/dvops-bloggers-app:latest
          docker push dvopsbloggers.azurecr.io/dvops-bloggers-app:${{ github.run_number }}
          docker push dvopsbloggers.azurecr.io/dvops-bloggers-app:latest

  deploy:
    name: Deploy to Azure AKS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set AKS context
        run: |
          az aks get-credentials --resource-group dvops-bloggers-rg --name dvops-cluster --overwrite-existing
      
      - name: Update deployment image tag
        run: |
          sed -i 's|dvopsbloggers.azurecr.io/dvops-bloggers-app:latest|dvopsbloggers.azurecr.io/dvops-bloggers-app:${{ github.run_number }}|g' deployment-azure.yaml
      
      - name: Deploy to AKS
        run: |
          kubectl apply -f deployment-azure.yaml
          kubectl apply -f service-azure.yaml
      
      - name: Wait for rollout
        run: kubectl rollout status deployment/dvops-bloggers-deploy-azure --timeout=5m
      
      - name: Get service info
        run: |
          echo "🚀 Deployment complete!"
          kubectl get service dvops-bloggers-service-azure
